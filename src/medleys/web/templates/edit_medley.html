{% extends "base.html" %}
{% block title %}{{ t("edit_medley") }}{% endblock %}
{% block content %}
<section class="page-header">
  <h1>{{ t("edit_medley") }}</h1>
  <p>{{ t("edit_medley_intro") }}</p>
</section>

<form class="panel edit-medley-form" method="post" action="{{ lang_url('edit_medley', source_id=source_id) }}">
  <label>
    {{ t("medley_name") }}
    <input name="medley_name" type="text" maxlength="80" value="{{ medley.name }}">
  </label>
  {% set picker_songs = songs %}
  {% set allow_url_add = true %}
  {% include "_song_picker.html" %}
  <div class="inline-fields">
    <label>
      {{ t("delay_ms") }}
      <input name="delay_ms" type="number" min="0" value="2000">
    </label>
  </div>
  <label class="checkbox">
    <input name="refresh" type="checkbox">
    {{ t("refresh_known") }}
  </label>
  <div class="form-actions">
    <button type="submit">{{ t("save_and_recreate") }}</button>
    <a class="button-link secondary-action" href="{{ lang_url('medley', source_id=source_id) }}">{{ t("cancel") }}</a>
  </div>
</form>
<script src="{{ url_for('static', filename='song_picker.js') }}" defer></script>
{% endblock %}
