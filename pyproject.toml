[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "medleys"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "Flask>=3.1,<4",
    "playwright>=1.45",
]

[project.scripts]
medleys-compare = "medleys.cli.compare:main"
medleys-render = "medleys.cli.render:main"
medleys-scrape = "medleys.cli.scrape:main"
medleys-update = "medleys.cli.update_db:main"
medleys-web = "medleys.web.app:main"

[tool.setuptools.package-data]
"medleys.web" = [
    "locales/*.json",
    "static/*.css",
    "static/*.js",
    "templates/*.html",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "C4",
    "RUF",
]
ignore = ["UP017"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

[tool.coverage.run]
branch = true
source = ["medleys"]
omit = [
    "src/medleys/cli/__init__.py",
    "src/medleys/cli/compare.py",
    "src/medleys/cli/scrape.py",
    "src/medleys/cli/update_db.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
files = [
    "src",
    "tests",
]
mypy_path = "src"
